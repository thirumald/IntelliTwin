name: Build region data

# Builds the other UAE regions (tools/regions.py) into data/<region>/.
#   mode synthetic: real OpenStreetMap roads and sites, with a synthetic traffic pattern (fast).
#   mode sumo:      the same, with a SUMO simulation per region (slow; replaces the synthetic pattern).
# Abu Dhabi city, the default region, is built by build-data.yml.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Traffic: synthetic pattern or SUMO simulation'
        type: choice
        options: [synthetic, sumo]
        default: synthetic
  push:
    paths:
      - 'tools/regions.py'
      - '.github/workflows/build-regions.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: build-regions-${{ github.ref }}-${{ inputs.mode || 'synthetic' }}
  cancel-in-progress: true

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      week: ${{ steps.week.outputs.week }}
    steps:
      - name: Week number for the OpenStreetMap cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore OpenStreetMap extract
        id: osmcache
        uses: actions/cache/restore@v4
        with:
          path: build/gcc-states.osm.pbf
          key: geofabrik-gcc-${{ steps.week.outputs.week }}
      - name: Download the Geofabrik GCC extract
        if: steps.osmcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build
          curl -fL --retry 6 --retry-all-errors --retry-delay 30 --connect-timeout 30 -o build/gcc-states.osm.pbf https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf
      - name: Save OpenStreetMap extract
        if: steps.osmcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/gcc-states.osm.pbf
          key: geofabrik-gcc-${{ steps.week.outputs.week }}

  build:
    needs: osm
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        region: [dubai, sharjah, ajman, ummalquwain, rasalkhaimah, fujairah, alain]
    env:
      MODE: ${{ inputs.mode || 'synthetic' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install -q -r tools/requirements.txt
      - name: Restore OpenStreetMap extract
        uses: actions/cache/restore@v4
        with:
          path: build/gcc-states.osm.pbf
          key: geofabrik-gcc-${{ needs.osm.outputs.week }}
      - name: Fetch and filter OpenStreetMap roads
        env:
          ITW_REGION: ${{ matrix.region }}
        run: bash tools/fetch_osm.sh build
      - name: Build network and traffic, export
        run: |
          rm -rf "out/${{ matrix.region }}"
          python tools/build.py --osm build/roads.osm --build build --out "out/${{ matrix.region }}" --extra build/extra.osm \
            --osm-timestamp "$(cat build/osm_timestamp.txt)" --region "${{ matrix.region }}" --mode "$MODE" --no-buildings
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = os.environ['REGION']
          m = json.load(open(f'out/{r}/meta.json'))
          print(f"### {m['region_name']} ({m['traffic']})")
          print('network:', m['network'])
          print('\nextra:', m['extra'])
          for s in m['scenarios']:
              print(f"\n**{s['id']}** trips {s['trips']} stats {s['stats']}")
              print('speed by 30 min:', [b['speed'] for b in s['bins']][::6])
              print('vehicles by 30 min:', [b['vehicles'] for b in s['bins']][::6])
          PY
          ls -lh "out/$REGION"
        env:
          REGION: ${{ matrix.region }}
      - uses: actions/upload-artifact@v4
        with:
          name: region-${{ matrix.region }}
          path: out/${{ matrix.region }}
          retention-days: 3

  commit:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: region-*
          path: incoming
      - name: Commit the regions that built and redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for d in incoming/region-*; do
            r="${d#incoming/region-}"
            [ -s "$d/meta.json" ] || continue
            # A push-triggered (synthetic) build never replaces a region that already has a simulation.
            if [ "${{ github.event_name }}" = "push" ] && grep -q '"traffic": "simulated"' "data/$r/meta.json" 2>/dev/null; then
              echo "region $r: keeping the existing simulation"; continue
            fi
            rm -rf "data/$r"; mkdir -p "data/$r"; cp -r "$d"/. "data/$r"/
            echo "region $r: $(du -sh "data/$r" | cut -f1)"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild region data [skip ci]"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          gh workflow run jekyll-gh-pages.yml --ref "${GITHUB_REF_NAME}" || true
